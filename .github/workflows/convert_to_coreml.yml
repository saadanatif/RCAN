name: Convert RCAN to CoreML

on:
  workflow_dispatch:
    inputs:
      scale:
        description: 'Super-resolution scale (2, 3, 4, or 8)'
        required: true
        default: '3'
        type: choice
        options:
          - '2'
          - '3'
          - '4'
          - '8'
      quantize:
        description: 'Quantize model to 16-bit'
        required: false
        default: true
        type: boolean
      input_size:
        description: 'Input image size (e.g., 180 for 180x180)'
        required: false
        default: '180'
        type: string
  push:
    branches:
      - main
    paths:
      - 'convert_to_coreml.py'
      - 'download_model.py'
      - '.github/workflows/convert_to_coreml.yml'
  pull_request:
    branches:
      - main

jobs:
  convert:
    name: Convert RCAN to CoreML
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Download RCAN models
        env:
          SCALE: ${{ github.event.inputs.scale || '3' }}
        run: |
          echo "Downloading RCAN models..."
          python download_model.py --output_dir models
          
          # Verify the model exists
          if [ ! -f "models/RCAN_BIX${SCALE}.pt" ]; then
            echo "Error: RCAN_BIX${SCALE}.pt not found!"
            ls -la models/
            exit 1
          fi
          
          echo "✓ Model downloaded successfully"
      
      - name: Convert to CoreML
        env:
          SCALE: ${{ github.event.inputs.scale || '3' }}
          QUANTIZE: ${{ github.event.inputs.quantize || 'true' }}
          INPUT_SIZE: ${{ github.event.inputs.input_size || '180' }}
        run: |
          echo "Converting RCAN_BIX${SCALE}.pt to CoreML..."
          
          QUANTIZE_FLAG=""
          if [ "$QUANTIZE" = "true" ]; then
            QUANTIZE_FLAG="--quantize"
          fi
          
          python convert_to_coreml.py \
            --model_path models/RCAN_BIX${SCALE}.pt \
            --output models/RCAN_BIX${SCALE}.mlmodel \
            --scale ${SCALE} \
            --input_height ${INPUT_SIZE} \
            --input_width ${INPUT_SIZE} \
            ${QUANTIZE_FLAG}
          
          echo "✓ Conversion complete"
      
      - name: Verify CoreML model
        env:
          SCALE: ${{ github.event.inputs.scale || '3' }}
          QUANTIZE: ${{ github.event.inputs.quantize || 'true' }}
        run: |
          echo "Verifying CoreML models..."
          ls -lh models/*.mlmodel
          
          # Print model info
          python -c "
          import coremltools as ct
          import os
          
          model_path = 'models/RCAN_BIX${SCALE}.mlmodel'
          if os.path.exists(model_path):
              model = ct.models.MLModel(model_path)
              print(f'\n✓ Full precision model loaded successfully')
              print(f'  Size: {os.path.getsize(model_path) / (1024*1024):.2f} MB')
          
          if '${QUANTIZE}' == 'true':
              quantized_path = 'models/RCAN_BIX${SCALE}_quantized.mlmodel'
              if os.path.exists(quantized_path):
                  model = ct.models.MLModel(quantized_path)
                  print(f'\n✓ Quantized model loaded successfully')
                  print(f'  Size: {os.path.getsize(quantized_path) / (1024*1024):.2f} MB')
          "
      
      - name: Create model info
        env:
          SCALE: ${{ github.event.inputs.scale || '3' }}
        run: |
          cat > models/MODEL_INFO.txt << EOF
          RCAN CoreML Model Information
          ==============================
          
          Model: RCAN_BIX${SCALE}
          Scale: ${SCALE}x super-resolution
          Architecture: Residual Channel Attention Network
          
          Model Details:
          - Residual Groups: 10
          - Residual Blocks per Group: 20
          - Feature Maps: 64
          - Channel Attention Reduction: 16
          
          Original Paper:
          "Image Super-Resolution Using Very Deep Residual Channel Attention Networks"
          Yulun Zhang et al., ECCV 2018
          
          Conversion Date: $(date)
          GitHub Actions Run: ${{ github.run_number }}
          
          Files Generated:
          EOF
          
          ls -lh models/*.mlmodel | awk '{print "- " $9 " (" $5 ")"}' >> models/MODEL_INFO.txt
          
          cat models/MODEL_INFO.txt
      
      - name: Upload CoreML models as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rcan-coreml-models-scale${{ github.event.inputs.scale || '3' }}
          path: |
            models/*.mlmodel
            models/MODEL_INFO.txt
          retention-days: 90
      
      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            models/*.mlmodel
            models/MODEL_INFO.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Summary
        env:
          SCALE: ${{ github.event.inputs.scale || '3' }}
        run: |
          echo "## 🎉 Conversion Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Model Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Scale:** ${SCALE}x" >> $GITHUB_STEP_SUMMARY
          echo "- **Input Size:** ${{ github.event.inputs.input_size || '180' }}x${{ github.event.inputs.input_size || '180' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Quantized:** ${{ github.event.inputs.quantize || 'true' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Generated Files" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -lh models/*.mlmodel >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ CoreML models are available as artifacts" >> $GITHUB_STEP_SUMMARY
